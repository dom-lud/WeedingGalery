name: PR Validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: write

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x backend/mvnw

      - name: Run backend formatting check
        working-directory: backend
        run: ./mvnw -B spotless:check

      - name: Run backend tests
        working-directory: backend
        run: ./mvnw -B verify

      - name: Require MySQL migration contract execution
        shell: bash
        run: |
          report="backend/target/surefire-reports/TEST-pl.backend.weddinggallery.MySqlFlywayMigrationContractTest.xml"
          test -f "$report"
          grep -q 'tests="1" errors="0" skipped="0" failures="0"' "$report"

      - name: Summarize backend tests and coverage
        if: always()
        run: node .github/scripts/ci-metrics.mjs backend backend

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: warn
          name: backend-coverage
          path: |
            backend/target/site/jacoco/
            backend/target/surefire-reports/
          retention-days: 30

      - name: Upload backend quality metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: warn
          name: backend-quality-metrics
          path: quality-report-parts/backend.json
          retention-days: 30

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Restore frontend node_modules cache
        id: frontend-node-modules-cache
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node24-frontend-modules-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install frontend dependencies
        if: steps.frontend-node-modules-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Run frontend format check
        working-directory: frontend
        run: npm run format:check

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Run frontend tests
        working-directory: frontend
        run: npm run test:coverage -- --reporter=default --reporter=json --outputFile=vitest-results.json

      - name: Summarize frontend tests and coverage
        if: always()
        run: node .github/scripts/ci-metrics.mjs frontend frontend

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: warn
          name: frontend-coverage
          path: |
            frontend/coverage/
            frontend/vitest-results.json
          retention-days: 30

      - name: Upload frontend quality metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: warn
          name: frontend-quality-metrics
          path: quality-report-parts/frontend.json
          retention-days: 30

      - name: Run frontend build
        working-directory: frontend
        run: npm run build

  docker:
    name: Docker and Compose validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build backend image
        run: docker build -t wedding-gallery-backend:ci backend

      - name: Build frontend image
        run: docker build -t wedding-gallery-frontend:ci frontend

  e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Restore frontend node_modules cache
        id: e2e-node-modules-cache
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node24-frontend-modules-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install frontend dependencies
        if: steps.e2e-node-modules-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Resolve Playwright version
        id: playwright-version
        working-directory: frontend
        shell: bash
        run: |
          playwright_version="$(node -p 'require("./node_modules/@playwright/test/package.json").version')"
          printf 'version=%s\n' "$playwright_version" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browser cache
        id: playwright-browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ steps.playwright-version.outputs.version }}

      - name: Install Chromium system dependencies
        working-directory: frontend
        run: npx playwright install-deps chromium

      - name: Install Chromium browser
        if: steps.playwright-browser-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npx playwright install chromium

      - name: Start Backend
        working-directory: backend
        env:
          BOOTSTRAP_ADMIN_ENABLED: "true"
          BOOTSTRAP_ADMIN_EMAIL: admin@example.com
          BOOTSTRAP_ADMIN_PASSWORD: password123!
        run: |
          chmod +x mvnw
          ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev &

      - name: Start Frontend
        working-directory: frontend
        run: npm run dev &

      - name: Wait for services
        run: npx wait-on http-get://localhost:8080/actuator/health http-get://localhost:5173 -t 60000

      - name: Run Playwright tests
        id: playwright
        continue-on-error: true
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5173
        run: npx playwright test

      - name: Summarize Playwright results
        if: always()
        working-directory: frontend
        shell: bash
        env:
          PLAYWRIGHT_OUTCOME: ${{ steps.playwright.outcome }}
        run: node ../.github/scripts/ci-metrics.mjs playwright .

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: warn
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 30

      - name: Upload Playwright quality metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: warn
          name: playwright-quality-metrics
          path: frontend/quality-report-parts/e2e.json
          retention-days: 30

      - name: Fail job when Playwright tests fail
        if: steps.playwright.outcome == 'failure'
        run: exit 1

  report-pr-status:
    name: Report PR validation status
    runs-on: ubuntu-latest
    needs: [backend, frontend, docker, e2e]
    if: always()

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download quality metric parts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: "*-quality-metrics"
          path: quality-report-parts
          merge-multiple: true

      - name: Aggregate quality report
        if: always()
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          E2E_REQUIRED: "true"
        run: node .github/scripts/ci-metrics.mjs aggregate .

      - name: Add quality report to run summary
        if: always()
        shell: bash
        run: cat quality-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload machine quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: quality-report-json
          path: |
            quality-report.json
            quality-report.md
          retention-days: 30

      - name: Upsert PR status comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- pr-validation-report -->';
            const report = JSON.parse(fs.readFileSync('quality-report.json', 'utf8'));
            const markdown = fs.readFileSync('quality-report.md', 'utf8');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
              per_page: 100,
            });
            const artifactUrl = (name) => {
              const artifact = artifacts.find((candidate) => candidate.name === name && !candidate.expired);
              return artifact ? `${runUrl}/artifacts/${artifact.id}` : null;
            };
            const reportLinks = [
              ['Backend: JaCoCo + Surefire', artifactUrl('backend-coverage')],
              ['Frontend: coverage + Vitest JSON', artifactUrl('frontend-coverage')],
              ['Playwright: HTML report + traces', artifactUrl('playwright-report')],
              ['Machine JSON report', artifactUrl('quality-report-json')],
            ].filter(([, url]) => url);
            const links = reportLinks.length
              ? ['### Artifact links', ...reportLinks.map(([label, url]) => `- [${label}](${url})`), ''].join('\n')
              : '';
            const body = `${marker}\n${markdown}\n${links}Schema: \`${report.schemaVersion}\``;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existingComment = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );
            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }
