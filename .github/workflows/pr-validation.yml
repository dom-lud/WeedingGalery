name: PR Validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x backend/mvnw

      - name: Run backend formatting check
        working-directory: backend
        run: ./mvnw -B spotless:check

      - name: Run backend tests
        working-directory: backend
        run: ./mvnw -B test

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Restore frontend node_modules cache
        id: frontend-node-modules-cache
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node24-frontend-modules-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install frontend dependencies
        if: steps.frontend-node-modules-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Run frontend format check
        working-directory: frontend
        run: npm run format:check

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Run frontend tests
        working-directory: frontend
        run: npm run test

      - name: Run frontend build
        working-directory: frontend
        run: npm run build

  docker:
    name: Docker and Compose validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build backend image
        run: docker build -t wedding-gallery-backend:ci backend

      - name: Build frontend image
        run: docker build -t wedding-gallery-frontend:ci frontend

  e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Restore frontend node_modules cache
        id: e2e-node-modules-cache
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node24-frontend-modules-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install frontend dependencies
        if: steps.e2e-node-modules-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Restore Playwright browser cache
        id: playwright-browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright Browsers
        if: steps.playwright-browser-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npx playwright install --with-deps

      - name: Start Backend
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev &

      - name: Start Frontend
        working-directory: frontend
        run: npm run dev &

      - name: Wait for services
        run: npx wait-on http-get://localhost:8080/actuator/health http-get://localhost:5173 -t 60000

      - name: Run Playwright tests
        working-directory: frontend
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  report-failure:
    name: Report Failure to PR
    runs-on: ubuntu-latest
    needs: [backend, frontend, docker, e2e]
    if: always() && github.event_name == 'pull_request' && contains(needs.*.result, 'failure')
    steps:
      - name: Comment PR on failure
        uses: actions/github-script@v7
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        with:
          script: |
            const backend = process.env.BACKEND_RESULT;
            const frontend = process.env.FRONTEND_RESULT;
            const docker = process.env.DOCKER_RESULT;
            const e2e = process.env.E2E_RESULT;
            
            let failures = [];
            if (backend === 'failure') failures.push('- **Backend**: Błędy podczas testów, kompilacji (mvn test) lub formatowania (spotless).');
            if (frontend === 'failure') failures.push('- **Frontend**: Błędy podczas testów, lintowania, budowania lub formatowania (npm run ...).');
            if (docker === 'failure') failures.push('- **Docker**: Błąd podczas budowania obrazów lub w konfiguracji Docker Compose.');
            if (e2e === 'failure') failures.push('- **E2E (Playwright)**: Testy E2E zawiodły. Pobierz artefakt `playwright-report`, żeby zobaczyć dokładny trace z błędami w przeglądarce.');
            
            const runUrl = context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId;
            const body = `🚨 **Pipeline failed!** 🚨\n\nZidentyfikowano problemy w następujących zadaniach:\n\n${failures.join('\\n')}\n\n[Kliknij tutaj, by sprawdzić szczegóły logów Action run](${runUrl}).`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            })
