# Konfiguracja testowa – nadpisuje application.yml dla wszystkich testów JUnit.
# Flyway wyłączony: testy używają Hibernate create-drop na H2 in-memory.
# Gdy testy migracji będą wymagane, użyj Testcontainers z MySQL (BACKEND_TESTING.md).
spring:
  application:
    name: WeddingGallery
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false
app:
  storage:
    local:
      root: ./target/test-media
  public-access:
    rate-limit: 1000
  security:
    csrf:
      enabled: false
