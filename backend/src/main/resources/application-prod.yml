spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:wedding_gallery}
    username: ${DB_USER:wedding}
    password: ${DB_PASSWORD:wedding}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      # Zgodnie z ADR 0012, tymczasowo update dla dev, docelowo validate
      ddl-auto: update
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
