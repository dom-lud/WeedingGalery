spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:wedding_gallery}
    username: ${DB_USER:wedding}
    password: ${DB_PASSWORD:wedding}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      # Produkcja waliduje schemat zarządzany przez Flyway, nie mutuje go przez Hibernate.
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/seed
    # Etap 1 pozostawil lokalne wolumeny z wykonanym schematem V1/V2 bez tabeli
    # historii Flyway. Puste bazy nadal wykonuja wszystkie migracje; istniejacy
    # schemat jest bezpiecznie przejmowany od wersji 2, a nastepnie dostaje V3+.
    baseline-on-migrate: true
    baseline-version: 2

server:
  port: 8080
