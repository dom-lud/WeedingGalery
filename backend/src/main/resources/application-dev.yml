# Profil developerski – lokalny development bez Dockera.
# Używa H2 in-memory; Flyway tworzy schemat z migracjami.
# Actuator ujawnia szczegóły zdrowia dla wygody developera.
spring:
  datasource:
    url: jdbc:h2:mem:devdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration/common,classpath:db/migration/h2,classpath:db/seed
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

management:
  endpoint:
    health:
      show-details: always
