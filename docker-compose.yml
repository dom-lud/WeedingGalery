services:
  mysql:
    image: mysql:8.4
    container_name: weedinggalery-mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wedding_gallery}
      MYSQL_USER: ${MYSQL_USER:-wedding}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wedding}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.local
    container_name: weedinggalery-backend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-wedding_gallery}
      DB_USER: ${MYSQL_USER:-wedding}
      DB_PASSWORD: ${MYSQL_PASSWORD:-wedding}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: ./frontend
    container_name: weedinggalery-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
      mysql:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: weedinggalery-nginx
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
